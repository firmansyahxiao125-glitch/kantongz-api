name: kantongz

#
# Kebijakan restart, dipakai bersama.
#
# `docker-compose.prod.yml` sudah memakai pola anchor yang sama; berkas ini
# tertinggal, dan akibatnya TERAMATI: sesudah Docker Desktop dimulai ulang,
# `api` dan `web` bangkit karena keduanya `unless-stopped`, sementara postgres,
# redis, dan mailpit TIDAK — ketiganya tanpa kebijakan sama sekali. API lalu
# berputar gagal melawan basis data yang tidak ada (`Exited (1)`), dan yang
# terlihat pengembang hanyalah backend yang mati tanpa sebab.
#
# Ketergantungan harus punya daya hidup minimal SAMA dengan yang bergantung
# padanya. Dependensi yang mati lebih permanen daripada layanannya adalah cara
# paling andal menghasilkan restart-loop.
#
x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kantongz
      POSTGRES_PASSWORD: kantongz
      POSTGRES_DB: kantongz
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kantongz -d kantongz']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    # Persistensi disk DIMATIKAN. M3_SPEC §5.3 dan §19.2 — isi Redis berumur
    # pendek dan tidak boleh meninggalkan jejak di disk.
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP lokal. Menangkap seluruh email tanpa pernah mengirimkannya keluar, dan
  # menampilkannya di antarmuka web di :8025. Tanpa akun, tanpa biaya, dan tanpa
  # risiko email uji mendarat di kotak masuk orang sungguhan.
  mailpit:
    <<: *restart
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrasi berjalan sebagai proses TERPISAH yang selesai lalu keluar, bukan
  # dari dalam `src/index.ts`. Penyebaran bergulir menjalankan banyak instans
  # sekaligus, dan sepuluh instans yang masing-masing menerapkan migrasi saat
  # boot akan berlomba di atas tabel yang sama.
  migrate:
    image: ${API_IMAGE_DEV:-kantongz-api:dev}
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://kantongz:kantongz@postgres:5432/kantongz
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: https://api.kantongz.id
      JWT_AUDIENCE: kantongz-web
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?jalankan `npm run keys:generate` lalu ekspor}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?jalankan `npm run keys:generate` lalu ekspor}
      MASTER_KEY: ${MASTER_KEY:?jalankan `npm run keys:generate` lalu ekspor}
      HMAC_KEY_VERSION: ${HMAC_KEY_VERSION:-1}
    command: ['node', 'dist/platform/db/migrate.js']
    restart: 'no'

  api:
    image: ${API_IMAGE_DEV:-kantongz-api:dev}
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      # API baru boleh hidup SESUDAH migrasi selesai dengan sukses. Tanpa syarat
      # ini, permintaan pertama menemui tabel yang belum ada.
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: '3000'
      HOST: 0.0.0.0
      DATABASE_URL: postgres://kantongz:kantongz@postgres:5432/kantongz
      REDIS_URL: redis://redis:6379
      JWT_ISSUER: https://api.kantongz.id
      JWT_AUDIENCE: kantongz-web
      # Rahasia TIDAK ditulis di berkas ini. Berkas compose ikut ter-commit;
      # `:?` membuat `docker compose up` berhenti dengan pesan yang jelas alih-alih
      # menjalankan API dengan kunci kosong.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?jalankan `npm run keys:generate` lalu ekspor}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?jalankan `npm run keys:generate` lalu ekspor}
      MASTER_KEY: ${MASTER_KEY:?jalankan `npm run keys:generate` lalu ekspor}
      HMAC_KEY_VERSION: ${HMAC_KEY_VERSION:-1}
      # Asal peramban yang boleh memanggil langsung. Aplikasi web memanggil
      # buku besar dari peramban dengan Bearer token; tanpa daftar ini setiap
      # panggilan itu diblokir peramban sebelum sempat berangkat.
      #
      # 3100 = aplikasi web di dalam kontainer. 8081 = Metro, tempat aplikasi
      # mobile dijalankan di React Native Web untuk verifikasi. 3001 = `next
      # dev`, yang selalu mundur ke sana karena 3000 sudah dipakai API ini —
      # tanpa entri itu, setiap pengembang baru menabrak dinding CORS pada
      # permintaan pertamanya dan sangkaannya jatuh ke tempat yang salah.
      #
      # Seluruh daftar ini HANYA untuk lingkungan pengembangan — penyebaran
      # produksi menyetel `CORS_ORIGINS` sendiri dan tidak mewarisi bawaan ini.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100,http://localhost:8081,http://127.0.0.1:8081,http://localhost:3001,http://127.0.0.1:3001}
      # Email lewat Mailpit — lokal, tanpa akun, tanpa biaya. Ganti ke SMTP
      # penyedia sungguhan hanya dengan mengubah host dan kredensialnya.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: ${MAIL_FROM:-noreply@kantongz.id}
      # Model LOKAL. `host.docker.internal` menunjuk Ollama yang berjalan di
      # mesin pengembang, bukan di dalam kontainer — model bahasa di dalam
      # kontainer akan mengunduh ulang bobotnya pada setiap build.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports: ['3000:3000']
    # Meneruskan SIGTERM ke PID 1 supaya penutupan tertib benar-benar berjalan.
    init: true
    restart: unless-stopped

  # Tag DEV yang eksplisit, dan ini bukan kerapian.
  #
  # Tanpa kunci `image:`, Compose menurunkan nama dari nama proyek dan menjadi
  # `kantongz-web:latest` — TAG YANG SAMA PERSIS dengan yang dibangun
  # `docker-compose.prod.yml` (`${WEB_IMAGE:-kantongz-web:latest}`). Yang
  # membangun terakhir menang, diam-diam.
  #
  # Akibatnya terukur: bundel klien dev berisi `https://localhost` yang
  # dipanggang dari `PUBLIC_API_URL` milik produksi, peramban menolak
  # sertifikatnya (`ERR_CERT_AUTHORITY_INVALID`), dan SETIAP panggilan buku
  # besar gagal — sementara kontainernya tetap melaporkan diri "healthy".
  #
  # `NEXT_PUBLIC_*` dipanggang saat build, jadi satu tag bersama untuk dua
  # konfigurasi build adalah cacat, bukan penghematan.
  web:
    image: ${WEB_IMAGE_DEV:-kantongz-web:dev}
    build:
      context: ../kantongz-web
      args:
        # Dibaca saat build: Next.js memanggang variabel `NEXT_PUBLIC_*` ke
        # dalam bundel klien, jadi nilainya harus ada sebelum `next build`.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Dipakai rute BFF di dalam kontainer — nama layanan, bukan localhost.
      API_URL: http://api:3000
      PORT: '3100'
      HOSTNAME: 0.0.0.0
    ports: ['3100:3100']
    init: true
    restart: unless-stopped

volumes:
  pgdata:
