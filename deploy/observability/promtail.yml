server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kontainer
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      # Nama kontainer menjadi label, tanpa garis miring di depan.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: kontainer
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: aliran

    pipeline_stages:
      # Log API berbentuk JSON dari pino. Mengurainya di sini membuat
      # `requestId` dapat dicari sebagai label — dan itulah yang menghubungkan
      # satu baris log dengan satu permintaan yang dikeluhkan pengguna.
      - json:
          expressions:
            level: level
            requestId: requestId
            msg: msg
      - labels:
          level:
      # `requestId` TIDAK dijadikan label.
      #
      # Ia unik per permintaan, dan label unik di Loki menghasilkan satu aliran
      # baru per nilai — persis kesalahan kardinalitas yang meruntuhkan Loki.
      # Ia tetap dapat DICARI di dalam isi baris:
      #   {kontainer="kantongz-prod-api-1"} |= "01K9ABC..."
